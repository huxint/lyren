# Lyren preferences. Changes apply immediately, except GPU selection requires a restart.
# All options are also available in Settings. Remove this file to restore the defaults.

[interface]
# en | zh
language = "zh"

[window]
# client: integrated title bar; server: native compositor decorations
decorations = "client"
# Values below 1 enable compositor background blur.
opacity = 1.0

[gpu]
# integrated: lower power use; discrete: dedicated GPU. Requires a restart.
device = "integrated"

[render]
# Animation frame limit. 0 follows the display refresh rate.
max_fps = 60

[playback]
# standard | higher | exhigh | lossless | hires. Availability depends on your account.
quality = "lossless"
# skip: skip preview-only tracks; play: play the available preview
trial = "skip"
# Match track loudness using the gain reported by the service.
normalize = false

[theme]
# dark | light
mode = "dark"
# "auto" follows the album cover, or use a color such as "#c33449".
accent = "auto"
# Fontconfig family name, such as "sans-serif" or "Noto Sans CJK SC".
font = "sans-serif"
# Base text size in logical pixels.
font_size = 14
# Corner radius in logical pixels.
radius = 10
# Animation duration multiplier. 0 disables transitions.
motion = 1.0

# Optional overrides. Omitted keys follow the selected theme.
# Colors accept "#rgb", "#rrggbb", or "#rrggbbaa".
[theme.colors]
# bg = "#111113"
# surface = "#1a1a1e"
# elevated = "#232329"
# border = "#2c2c33"
# text = "#ececf1"
# text_dim = "#9a9aa5"
# danger = "#e5484d"

# Appearance only. Visibility, placement, locking and translation are player controls.
[desktop_lyrics]
font_size = 30
# "accent" follows the accent color, or use a custom color.
highlight = "accent"
color = "#ffffff"
outline = "#000000a0"

[desktop_lyrics.island]
cover = true
progress = true
# Optional components in the expanded island.
details = false
controls = false
volume = false
